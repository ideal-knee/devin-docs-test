<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11131a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Reminders Mirror</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<header>
  <h1>Reminders Mirror</h1>
  <nav>
    <a href="#/open" data-route="/open">Open</a>
    <a href="#/all" data-route="/all">All</a>
    <a href="#/stats" data-route="/stats">Stats</a>
    <a href="#/dashboard" data-route="/dashboard">Dashboard</a>
    <a href="#/settings" data-route="/settings">Settings</a>
    <a href="#/setup" data-route="/setup">Setup</a>
  </nav>
</header>

<main id="view"></main>

<template id="tpl-list">
  <section class="screen">
    <div class="toolbar">
      <input id="q" type="search" placeholder="Filter by title, list or note" autocomplete="off">
      <select id="list-filter"><option value="">All lists</option></select>
      <button id="refresh" class="ghost">Refresh</button>
    </div>
    <p id="status" class="status"></p>
    <ul id="items" class="items"></ul>
    <p id="empty" class="empty" hidden>Nothing here.</p>
  </section>
</template>

<template id="tpl-stats">
  <section class="screen">
    <p id="stats-status" class="status"></p>
    <div id="cards" class="cards"></div>
    <h3 class="chart-title">Completed per day <small id="chart-range"></small></h3>
    <div id="chart" class="chart"></div>
    <h3 class="chart-title">By list</h3>
    <table id="by-list" class="table">
      <thead>
        <tr><th>List</th><th>Open</th><th>Done</th><th>Late</th><th>Median age</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <p id="stats-gaps" class="warn-note" hidden></p>
  </section>
</template>

<template id="tpl-dashboard">
  <section class="screen">
    <p id="dashboard-status" class="status"></p>
    <h3 class="chart-title">Completed</h3>
    <div id="completed-cards" class="cards"></div>
    <h3 class="chart-title">Open by age</h3>
    <div id="age-cards" class="cards"></div>
    <h3 class="chart-title">Recently completed</h3>
    <ul id="recent" class="items"></ul>
    <h3 class="chart-title">Months ranked by completions</h3>
    <table id="month-rank" class="table">
      <thead>
        <tr><th>Month</th><th>Completed</th><th>Rank</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
</template>

<template id="tpl-settings">
  <section class="screen prose">
    <h2>Private data repo</h2>
    <p>This page is public; your reminders are not. Point it at a private repository
      that the exporter writes to, and give it a read-only token. Both stay in this
      browser&rsquo;s <code>localStorage</code> and are never sent anywhere except
      <code>api.github.com</code>.</p>
    <form id="settings-form" class="form">
      <label>Data repo <small>owner/name</small>
        <input id="f-repo" type="text" placeholder="ideal-knee/reminder-data"
               autocapitalize="none" autocorrect="off" spellcheck="false">
      </label>
      <label>File path
        <input id="f-path" type="text" placeholder="reminders.yaml"
               autocapitalize="none" autocorrect="off" spellcheck="false">
      </label>
      <label>Branch
        <input id="f-branch" type="text" placeholder="main"
               autocapitalize="none" autocorrect="off" spellcheck="false">
      </label>
      <label>Read-only token
        <input id="f-token" type="password" placeholder="github_pat_&hellip;"
               autocapitalize="none" autocorrect="off" spellcheck="false">
        <small><a href="https://github.com/settings/personal-access-tokens/new"
           target="_blank" rel="noopener">Create a fine-grained token</a> &mdash; under
          <i>Repository access</i> pick only your data repo, then <i>Repository
          permissions &rarr; Contents &rarr; Read-only</i>.</small>
      </label>
      <label>Passcode <small>optional &mdash; encrypts the stored token</small>
        <input id="f-pass" type="password" placeholder="leave blank to store in plain text"
               autocapitalize="none" autocorrect="off" spellcheck="false">
      </label>
      <div class="row">
        <button type="submit">Save &amp; load</button>
        <button type="button" id="f-lock" class="ghost" hidden>Lock</button>
        <button type="button" id="f-clear" class="ghost">Forget token</button>
      </div>
      <p id="settings-msg" class="status"></p>
    </form>
    <p class="warn-note">With a passcode the token is encrypted at rest with AES-GCM
      under a PBKDF2 key, and only the decrypted copy in memory is used &mdash; so
      someone holding this device still needs the passcode. Without one it sits in
      <code>localStorage</code> in plain text. Either way, scope the token to the data
      repo with <i>Contents: Read-only</i> and revoke it if the device goes missing.</p>
  </section>
</template>

<template id="tpl-setup">
  <section class="screen prose">
    <h2>How the data gets here</h2>
    <p>This page is public; your reminders are not. A small macOS exporter reads
      Apple Reminders through EventKit and pushes a YAML snapshot to a private
      repository. This page then reads that file through the GitHub API with a
      read-only token.</p>

    <h3>1. Private data repo and tokens</h3>
    <p>Use a <b>private</b> repo that holds only the snapshot. You need two
      fine-grained personal access tokens, both scoped to that repo:</p>
    <ul>
      <li><b>Write token</b> &mdash; <i>Contents: Read and write</i>. Stored in
        macOS Keychain for the exporter.</li>
      <li><b>Read token</b> &mdash; <i>Contents: Read-only</i>. Pasted into
        <a href="#/settings">Settings</a> on each browser.</li>
    </ul>
    <p>Create them at
      <a href="https://github.com/settings/personal-access-tokens/new"
         target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>.</p>

    <h3>2. Install the exporter</h3>
    <p>In the repo root, create a virtualenv and install the requirements:</p>
    <pre><code>python3 -m venv .venv
.venv/bin/pip install -r reminders/requirements.txt</code></pre>

    <h3>3. Store the write token in Keychain</h3>
    <pre><code>security add-generic-password -s reminders-export -a github-token -w YOUR_WRITE_TOKEN</code></pre>
    <p>When Keychain prompts, allow the exporter to read it.</p>

    <h3>4. Run once manually</h3>
    <pre><code>.venv/bin/python reminders/export_reminders_to_github.py --token-keychain reminders-export</code></pre>
    <p>If the target file does not exist, the first run creates it. After this
      succeeds, paste your read token into <a href="#/settings">Settings</a>.</p>

    <h3>5. Schedule with launchd</h3>
    <p>The agent runs the export through Terminal so macOS's Reminders permission already
      granted to Terminal is reused. Copy the agent plist into your LaunchAgents folder and
      load it:</p>
    <pre><code>mkdir -p ~/Library/LaunchAgents
cp /Users/dkee/Development/ideal-knee/devin-docs-test/reminders/com.ideal-knee.export-reminders.plist \
   ~/Library/LaunchAgents/com.ideal-knee.export-reminders.plist
chmod 600 ~/Library/LaunchAgents/com.ideal-knee.export-reminders.plist
launchctl load -w ~/Library/LaunchAgents/com.ideal-knee.export-reminders.plist</code></pre>
    <p>It runs at the top of each hour and once immediately when loaded. Logs go to
      <code>reminders/export-reminders.log</code>. To stop it:</p>
    <pre><code>launchctl unload -w ~/Library/LaunchAgents/com.ideal-knee.export-reminders.plist</code></pre>

    <h3>Why not just make this repo private?</h3>
    <p>A private repo can host Pages on a paid plan, but the published site is still
      public to anyone with the URL unless the repo belongs to a GitHub Enterprise Cloud
      organization. Splitting the data into its own private repo keeps the snapshot off
      the public web without depending on that.</p>
    <p><a href="../">&larr; Back to the site</a></p>
  </section>
</template>

<div id="gate" hidden>
  <form class="gate-card" id="gate-form">
    <h2>Locked</h2>
    <p>Enter the passcode to decrypt your GitHub token on this device.</p>
    <input id="gate-pass" type="password" placeholder="Passcode"
           autocapitalize="none" autocorrect="off" spellcheck="false">
    <p id="gate-msg" class="status"></p>
    <div class="row">
      <button type="submit">Unlock</button>
      <button type="button" id="gate-skip" class="ghost">View sample data</button>
    </div>
  </form>
</div>

<footer>
  <span id="mode" class="tag"></span>
  <span id="stamp" class="stamp"></span>
</footer>

<script src="js-yaml.min.js?v=1"></script>
<script src="app.js?v=2"></script>
</body>
</html>
